[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-x"
version = "0.1.0"
description = "Portfolio Risk & Stress Testing Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.3,<2",
    "plotly>=5.18,<7",
    "streamlit>=1.30,<2",
    "pytest>=7.4,<9",
]

[project.optional-dependencies]
market-data = [
    "yfinance>=0.2.40,<1",
]
advanced = [
    "xgboost>=2.0,<4",
    "shap>=0.44,<1",
    "networkx>=3.2,<4",
    "cvxpy>=1.4,<2",
]
deep-learning = [
    "tensorflow>=2.15,<3",
]
sentiment = [
    "transformers>=4.36,<5",
    "torch>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
