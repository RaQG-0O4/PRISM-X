# PRISM-X professional finance dashboard theme.
# The palette uses cool institutional tones with semantic colours for risk.

[theme]
base = "dark"
primaryColor = "#6E8BFF"
backgroundColor = "#0A1020"
secondaryBackgroundColor = "#13213A"
codeBackgroundColor = "#101B31"
textColor = "#E5E7EB"
linkColor = "#8DB5FF"
borderColor = "#2A4266"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
headingFont = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "23px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colours: positive performance, warnings and portfolio risk.
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = [
  "#7C9CFF",
  "#2DD4BF",
  "#C084FC",
  "#34D399",
  "#FBBF24",
  "#FB7185",
  "#38BDF8",
  "#CBD5E1",
]

chartSequentialColors = [
  "#082F49",
  "#0C4A6E",
  "#075985",
  "#0369A1",
  "#0284C7",
  "#0EA5E9",
  "#38BDF8",
  "#7DD3FC",
  "#BAE6FD",
  "#E0F2FE",
]

dataframeBorderColor = "#2A4266"
dataframeHeaderBackgroundColor = "#1A3152"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#0F1A2D"
secondaryBackgroundColor = "#16253A"
codeBackgroundColor = "#111C2E"
textColor = "#E5E7EB"
borderColor = "#263A55"
primaryColor = "#4F8CFF"
